name: Build Quest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  OPENXR_VENDORS_VERSION: 5.1.0-stable
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  quest-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenXR Vendors plugin
        shell: bash
        run: |
          curl -L -o openxr-vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${{ env.OPENXR_VENDORS_VERSION }}/godotopenxrvendorsaddon.zip"
          unzip -q openxr-vendors.zip -d openxr-vendors
          mkdir -p addons
          mv openxr-vendors/asset/addons/godotopenxrvendors addons/godotopenxrvendors

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "build-tools;35.0.0"             "platforms;android-35"             "cmake;3.10.2.4988404"             "ndk;23.2.8568313"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Install Android build template
        shell: bash
        run: |
          # Extract Android template from cached export templates
          ANDROID_SOURCE="$(find "$HOME/.local/share/godot/export_templates" -type f -name android_source.zip -print -quit)"
          if [ -z "$ANDROID_SOURCE" ]; then
            echo "ERROR: Android template not found in cache"
            exit 1
          fi

          echo "Found Android template: $ANDROID_SOURCE"

          # Extract to temp dir first to inspect structure
          TEMP_EXTRACT="/tmp/android_template_temp"
          mkdir -p "$TEMP_EXTRACT"
          unzip -q "$ANDROID_SOURCE" -d "$TEMP_EXTRACT"

          echo "Extracted template structure:"
          find "$TEMP_EXTRACT" -maxdepth 2 -type d

          # Godot gradle template should have a build/ directory with gradle content
          # Copy the extracted content to .godot/builds/android_quest
          GODOT_ANDROID_DIR=".godot/builds/android_quest"
          mkdir -p "$GODOT_ANDROID_DIR"

          # Copy the extracted contents (handles both "build/" and "asset/addons/" subdirs)
          cp -r "$TEMP_EXTRACT"/* "$GODOT_ANDROID_DIR/" 2>/dev/null || true

          # If there's a nested build directory, use that
          if [ -d "$TEMP_EXTRACT/build" ] && [ ! -d "$GODOT_ANDROID_DIR/build" ]; then
            cp -r "$TEMP_EXTRACT/build" "$GODOT_ANDROID_DIR/"
          fi

          # Create .build_version file for gradle build system
          echo "Creating .build_version with version: $GODOT_VERSION"
          echo -n "$GODOT_VERSION" > "$GODOT_ANDROID_DIR/.build_version"

          # Verify installation
          if [ -f "$GODOT_ANDROID_DIR/.build_version" ]; then
            echo "OK: Template installed"
            echo "Final template structure:"
            find "$GODOT_ANDROID_DIR" -maxdepth 2 -type d
          else
            echo "ERROR: Failed to create version file"
            exit 1
          fi

          # Cleanup
          rm -rf "$TEMP_EXTRACT"


      - name: Build Quest APK
        shell: bash
        run: |
          mkdir -p build/android-quest
          godot --headless --path . --verbose --export-debug "Android Quest" "build/android-quest/ZC2-VR.apk"
          test -s build/android-quest/ZC2-VR.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZC2-VR-Quest-APK
          path: build/android-quest/ZC2-VR.apk
          if-no-files-found: error

      - name: Publish Quest test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quest-test-${{ github.run_number }}
          name: ZC2 VR Quest Test #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: build/android-quest/ZC2-VR.apk
